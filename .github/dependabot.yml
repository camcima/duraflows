version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 is held: typescript-eslint peers typescript <6.1.0
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Held by maintainer (2026-10): remove this entry to resume updates
      - dependency-name: "@nestjs/*"
      # Majors only: keep @types/node on its current major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
