name: Release

# Phase 2 of the release (see RELEASING.md): publishing is driven by pushing a
# `vX.Y.Z` tag — never by a direct push to protected `main`. This job builds the
# tagged commit and publishes all four packages to npm. (No GitHub release is
# created; the tag is the source of truth.)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
      - name: Publish packages to npm
        run: |
          # Auth lives in the user-level npmrc; the committed repo .npmrc only
          # holds link-workspace-packages, and pnpm merges both. The token is
          # written to a file (not stdout) and masked in logs.
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          pnpm -r publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
