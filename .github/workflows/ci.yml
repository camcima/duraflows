name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage-final.json
          flags: unit
          fail_ci_if_error: true
          # Use the supported PyPI distribution when cli.codecov.io is unavailable.
          use_pypi: true
          # The legacy endpoint avoids the failing ingest.codecov.io certificate.
          use_legacy_upload_endpoint: true

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: duraflows_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run packages/duraflows-pg/tests/integration packages/duraflows-kysely/tests/integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/duraflows_test
          # Turns a missing DATABASE_URL into a hard failure instead of a silent
          # skip, so a broken service container or secret cannot leave this job
          # green with zero real-SQL coverage.
          REQUIRE_INTEGRATION_DB: "1"

  # @duraflows/nestjs supports NestJS 11 and 12 (peer: ^11.0.0 || ^12.0.0). The
  # lockfile tracks 12; this matrix re-resolves each supported major and also
  # smoke-tests the packed dist (CJS + ESM) so the require(esm) path NestJS 12
  # relies on is covered.
  nestjs-compat:
    name: nestjs-compat (NestJS ${{ matrix.nest }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `range` re-resolves @nestjs/* before testing; empty = keep the lockfile.
          - { nest: "11.0.0 (floor)", range: "11.0.0", node: "20" }
          - { nest: "11", range: "^11", node: "20" }
          - { nest: "12", range: "", node: "20" }
          - { nest: "12", range: "", node: "22" }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Pin NestJS ${{ matrix.range }}
        if: matrix.range != ''
        run: >-
          pnpm --filter @duraflows/nestjs add -D
          "@nestjs/common@${{ matrix.range }}"
          "@nestjs/core@${{ matrix.range }}"
          "@nestjs/testing@${{ matrix.range }}"
          "@nestjs/platform-express@${{ matrix.range }}"
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm vitest run packages/duraflows-nestjs
      - run: node scripts/smoke-nestjs-consumer.mjs

  osv-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            --recursive
            .
